<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="theme-color" content="#07060b" />
    <title>Танкорост</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='1' y='3' width='3' height='11' fill='%23533'/%3E%3Crect x='12' y='3' width='3' height='11' fill='%23533'/%3E%3Crect x='4' y='4' width='8' height='9' fill='%23e8a83c'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23fce9a0'/%3E%3Crect x='7' y='0' width='2' height='7' fill='%23fce9a0'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #wrap { position: relative; }
      #wrap canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; }
      #hi, #world, #gl { pointer-events: none; }
      /* Экран загрузки страницы (до запуска игры): пиксельный заголовок, танк едет по полосе */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #07060b; z-index: 5; font: bold 16px/1.2 monospace; color: #9a92a0; letter-spacing: 2px; }
      #boot b { color: #fbcd4a; font-size: 44px; letter-spacing: 6px; text-shadow: 4px 4px 0 #5b3409; margin-bottom: 26px; }
      #boot .bar { position: relative; width: min(320px, 70vw); height: 12px; border: 2px solid #3a3550; background: #151320; margin-top: 34px; }
      #boot .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(90deg, #fbcd4a 0 8px, #df981c 8px 10px, #151320 10px 12px); animation: fill 2.4s steps(24) infinite; }
      #boot .tank { position: absolute; top: -22px; width: 20px; height: 12px; background: #fbcd4a; box-shadow: 0 6px 0 -2px #2e3f68, 8px -4px 0 -2px #df981c, 14px -4px 0 -4px #636b8a; animation: drive 2.4s steps(24) infinite; }
      @keyframes fill { to { width: 100%; } }
      @keyframes drive { from { left: -10px; } to { left: calc(100% - 10px); } }
    </style>
  </head>
  <body>
    <div id="boot"><b>ТАНКОРОСТ</b>загрузка…<div class="bar"><i></i><div class="tank"></div></div></div>
    <div id="wrap">
      <canvas id="gl"></canvas>
      <canvas id="world"></canvas>
      <canvas id="screen" tabindex="0"></canvas>
      <canvas id="hi"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
